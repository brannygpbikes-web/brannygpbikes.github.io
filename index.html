<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GP Bikes Academy Ranked</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  /* Home page uses background.png as a true full-page background */
  body.home {
    background-image: url("background.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  body.home::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: -1;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: calc(100vh - var(--topbar-h));
    padding: 20px;
  }

  .hero h1 {
    font-size: 48px;
    margin: 0 0 12px;
    text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
  }

  .hero p {
    color: #e5e5e5;
    font-size: 18px;
    max-width: 560px;
    margin: 0 0 32px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
  }

  .hero .buttons {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
    transition: transform 0.15s;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  .btn.primary {
    background: linear-gradient(180deg, var(--red), var(--red-dark));
    color: #fff;
  }

  .btn.discord {
    background: #5865f2;
    color: #fff;
  }

  @media (max-width: 700px) {
    .hero h1 { font-size: 32px; }
  }
</style>
</head>
<body class="home">

  <header class="topbar">
    <div class="brand">GP Bikes Academy Ranked</div>
  </header>

  <nav class="sidebar">
    <a href="ranked.html" class="active"><i class="fas fa-trophy"></i><span class="label">Ranked</span></a>
    <a href="https://discord.gg/YOUR-INVITE-CODE" target="_blank" rel="noopener noreferrer" class="discord-link">
      <i class="fab fa-discord"></i><span class="label">Join the Discord</span>
    </a>
  </nav>

  <main class="page">
    <div class="hero">
      <h1>GP Bikes Academy Ranked</h1>
      <p>Race. Win. Climb the leaderboard.</p>
      <div class="buttons">
        <a class="btn primary" href="ranked.html"><i class="fas fa-trophy"></i> View Rankings</a>
        <a class="btn discord" href="https://discord.gg/YOUR-INVITE-CODE" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-discord"></i> Join the Discord
        </a>
      </div>
    </div>
  </main>

</body>
</html>
