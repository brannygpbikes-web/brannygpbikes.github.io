<!DOCTYPE html>
<html lang="en">

<head>

          content="width=device-width, initial-scale=1.0">

          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="./style.css">


    <style>

        /* ==========================================
           CLICKABLE LEADERBOARD HEADINGS
           ========================================== */

        .sort-button {
            appearance: none;

            width: 100%;

            display: flex;
            align-items: center;

            gap: 6px;

            margin: 0;
            padding: 0;

            border: 0;

            color: inherit;
            background: none;

            font: inherit;
            text-align: left;

            text-transform: inherit;
            letter-spacing: inherit;

            cursor: pointer;
        }


        .sort-button:hover {
            color: #ffffff;
        }


        .sort-button i {

        }

        }

            color: #df252d;
        }


        /* Rank isn't sortable */

        .rank-heading {

        }


        @media (max-width: 700px) {

            .sort-button {
                gap: 3px;
            }


            .sort-button i {
                font-size: 7px;
            }

        }

</head>


<body>

    <!-- ==========================================

    <main class="page">

        <div class="page-content">

            <div class="page-title">

                    </h1>

                    </p>

                    </span>

                                class="sort-button active"
                                data-sort="elo"

                                data-sort="wins"

    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script>


        /*
            All loaded players are stored here.
        */

        let players = [];


        /*
            DEFAULT SORT:

            Elo
            Highest -> Lowest
        */

        let currentSort = "elo";

        let currentDirection = "desc";



        /* ==========================================
           LOAD ELO DATABASE
           ========================================== */

        async function loadPlayers() {


            const container =
                document.getElementById("players");


            try {


                const response = await fetch(

                    "./elo_db.json?v=" + Date.now(),

                    {
                        cache: "no-store"
                    }

                );


                if (!response.ok) {

                    throw new Error(
                        "elo_db.json returned HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();



                /*
                    Convert JSON into player objects.

                    Every property in each player's
                    stats object is preserved.
                */

                players =
                    Object.entries(data).map(

                        ([name, stats]) => ({

                            name: name,

                            ...stats,

                            elo:
                                Number(stats.elo) || 0,

                            wins:
                                Number(stats.wins) || 0

                        })

                    );



                /*
                    Display leaderboard.

                    Default:
                    highest Elo first.
                */

                sortPlayers();


            }


            catch (error) {


                console.error(
                    "Leaderboard error:",
                    error
                );


                container.innerHTML = `


                    <div class="status-message error-message">


                        <i class="fa-solid fa-triangle-exclamation"></i>


                        <strong>
                            Rankings could not be loaded.
                        </strong>


                        <small>
                            The website could not read elo_db.json.
                        </small>


                    </div>


                `;


            }


        }



        /* ==========================================
           SORT PLAYERS
           ========================================== */

        function sortPlayers() {


            players.sort((a, b) => {


                /*
                    PLAYER NAME

                    Alphabetical sorting.
                */

                if (currentSort === "name") {


                    const result =
                        a.name.localeCompare(
                            b.name,
                            undefined,
                            {
                                sensitivity: "base"
                            }
                        );


                    return currentDirection === "asc"
                        ? result
                        : -result;

                }



                /*
                    NUMERICAL STATS

                    Elo / Wins
                */

                const aValue =
                    Number(a[currentSort]) || 0;


                const bValue =
                    Number(b[currentSort]) || 0;


                if (aValue === bValue) {


                    /*
                        If two players have the
                        same value, use Elo as
                        the tie breaker.
                    */

                    if (currentSort !== "elo") {

                        return b.elo - a.elo;

                    }


                    /*
                        Same Elo:
                        sort alphabetically.
                    */

                    return a.name.localeCompare(
                        b.name
                    );

                }


                if (currentDirection === "desc") {

                    return bValue - aValue;

                }


                return aValue - bValue;


            });



            renderPlayers();

            updateSortButtons();

        }



        /* ==========================================
           DISPLAY PLAYERS
           ========================================== */

        function renderPlayers() {


            const container =
                document.getElementById("players");


            container.innerHTML = "";



            if (players.length === 0) {


                container.innerHTML = `

                    <div class="status-message">

                        No ranked players yet.

                    </div>

                `;


                return;

            }



            players.forEach(

                (player, index) => {


                    const row =
                        document.createElement("div");


                    row.className =
                        "player";


                    /*
                        Rank colour.
                    */

                    let rankClass = "";


                    if (index === 0) {

                        rankClass =
                            "rank-gold";

                    }


                    else if (index === 1) {

                        rankClass =
                            "rank-silver";

                    }


                    else if (index === 2) {

                        rankClass =
                            "rank-bronze";

                    }



                    row.innerHTML = `


                        <div class="rank ${rankClass}">

                            ${index + 1}

                        </div>


                        <div class="player-name">

                            ${escapeHTML(
                                player.name
                            )}

                        </div>


                        <div class="elo">

                            ${formatNumber(
                                player.elo
                            )}

                        </div>


                        <div class="wins">

                            ${formatNumber(
                                player.wins
                            )}

                        </div>


                    `;


                    container.appendChild(
                        row
                    );


                }

            );


        }



        /* ==========================================
           CLICK COLUMN HEADINGS
           ========================================== */

        document
            .querySelectorAll(".sort-button")
            .forEach(button => {


                button.addEventListener(
                    "click",
                    () => {


                        const selectedSort =
                            button.dataset.sort;



                        /*
                            Clicking the same heading
                            reverses its direction.
                        */

                        if (
                            selectedSort ===
                            currentSort
                        ) {


                            currentDirection =

                                currentDirection === "desc"

                                    ? "asc"

                                    : "desc";


                        }


                        /*
                            Clicking a different heading
                            chooses its sensible default.
                        */

                        else {


                            currentSort =
                                selectedSort;


                            /*
                                Player names:
                                A -> Z

                                Stats:
                                Highest -> Lowest
                            */

                            if (
                                selectedSort === "name"
                            ) {

                                currentDirection =
                                    "asc";

                            }

                            else {

                                currentDirection =
                                    "desc";

                            }


                        }



                        sortPlayers();


                    }

                );


            });



        /* ==========================================
           UPDATE SORT ARROWS
           ========================================== */

        function updateSortButtons() {


            document
                .querySelectorAll(".sort-button")
                .forEach(button => {


                    const icon =
                        button.querySelector("i");


                    button.classList.remove(
                        "active"
                    );


                    icon.className =
                        "fa-solid fa-sort";



                    if (
                        button.dataset.sort ===
                        currentSort
                    ) {


                        button.classList.add(
                            "active"
                        );


                        if (
                            currentDirection ===
                            "desc"
                        ) {

                            icon.className =
                                "fa-solid fa-arrow-down";

                        }

                        else {

                            icon.className =
                                "fa-solid fa-arrow-up";

                        }


                    }


                });



            /*
                Text in top-right of panel.
            */

            const description =
                document.getElementById(
                    "sort-description"
                );


            let name;


            if (currentSort === "name") {

                name = "Player";

            }

            else if (currentSort === "wins") {

                name = "Wins";

            }

            else {

                name = "Elo";

            }



            const directionText =

                currentSort === "name"

                    ? (
                        currentDirection === "asc"

                            ? "A–Z"

                            : "Z–A"
                    )

                    : (
                        currentDirection === "desc"

                            ? "Highest first"

                            : "Lowest first"
                    );


            description.textContent =
                `${name} • ${directionText}`;


        }



        /* ==========================================
           HELPERS
           ========================================== */

        function escapeHTML(value) {


            const element =
                document.createElement("div");


            element.textContent =
                String(value ?? "");


            return element.innerHTML;


        }



        function formatNumber(value) {


            const number =
                Number(value);


            if (!Number.isFinite(number)) {

                return "0";

            }


            return number.toLocaleString();


        }



        /* ==========================================
           START
           ========================================== */

        loadPlayers();


    </script>


</body>

</html>
