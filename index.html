<!DOCTYPE html>
<!-- saved from url=(0060)https://brannygpbikes-web.github.io/brannygpbikes.github.io/ -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GP Bikes Academy Ranked</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            /* Background image */
            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;

            min-height: 100vh;
        }

        /* Dark overlay to make the text easier to read */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.8);
        }

        header p {
            color: #dddddd;
            font-size: 17px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .leaderboard {
            background: rgba(17, 24, 39, 0.92);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .player {
            display: grid;
            grid-template-columns: 70px 1fr 150px 120px;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s;
        }

        .player:last-child {
            border-bottom: none;
        }

        .player:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .rank {
            color: #9ca3af;
            font-weight: bold;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
        }

        .elo {
            color: #60a5fa;
            font-weight: bold;
        }

        .wins {
            color: #34d399;
            font-weight: bold;
        }

        .headers {
            background: rgba(55, 65, 81, 0.95);
            color: #d1d5db;
            font-size: 14px;
            text-transform: uppercase;
        }

        .error {
            padding: 20px;
            text-align: center;
            color: #fca5a5;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header h1 {
                font-size: 32px;
            }

            .player {
                grid-template-columns: 40px 1fr 80px 70px;
                padding: 15px 10px;
            }

            .name {
                font-size: 15px;
            }

            .elo,
            .wins {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>GP Bikes Academy Ranked</h1>
    <p></p>
</header>

<div class="container">

    <div class="leaderboard">

        <!-- Table headings -->
        <div class="player headers">
            <div>N°</div>
            <div>Player</div>
            <div>Elo</div>
            <div>Wins</div>
        </div>

        <!-- Players are added here -->
        <div id="players"><div class="player">
                <div class="rank">1</div>
                <div class="name">branny</div>
                <div class="elo">1021</div>
                <div class="wins">2</div>
            </div><div class="player">
                <div class="rank">2</div>
                <div class="name">Scorlog</div>
                <div class="elo">1001</div>
                <div class="wins">—</div>
            </div><div class="player">
                <div class="rank">3</div>
                <div class="name">Shai3ackHurts</div>
                <div class="elo">995</div>
                <div class="wins">1</div>
            </div><div class="player">
                <div class="rank">4</div>
                <div class="name">MIRICI</div>
                <div class="elo">983</div>
                <div class="wins">0</div>
            </div></div>

    </div>

</div>

<script>

async function loadPlayers() {

    const container = document.getElementById("players");

    try {

        // Load elo_db.json
        const response = await fetch("elo_db.json");

        if (!response.ok) {
            throw new Error("Could not load elo_db.json");
        }

        const data = await response.json();

        /*
            Your JSON looks like:

            {
                "PlayerName": {
                    "elo": 1000,
                    "wins": 5
                }
            }
        */

        const players = Object.entries(data).map(([name, stats]) => ({
            name: name,
            elo: stats.elo ?? 0,
            wins: stats.wins
        }));

        // Highest Elo first
        players.sort((a, b) => b.elo - a.elo);

        container.innerHTML = "";

        players.forEach((player, index) => {

            const row = document.createElement("div");

            row.className = "player";

            // If wins isn't in the JSON, show "-"
            const wins = player.wins !== undefined
                ? player.wins
                : "—";

            row.innerHTML = `
                <div class="rank">${index + 1}</div>
                <div class="name">${escapeHTML(player.name)}</div>
                <div class="elo">${player.elo}</div>
                <div class="wins">${wins}</div>
            `;

            container.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Could not load <strong>elo_db.json</strong>.<br>
                Make sure it is in the same folder as index.html.
            </div>
        `;
    }
}


// Protect the page if a username contains HTML characters
function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// Start loading the leaderboard
loadPlayers();

</script>




</body></html>
