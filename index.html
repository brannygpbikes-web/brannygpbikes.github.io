<script>


/* ==========================================
   DATABASE
   ========================================== */

const ELO_URL =
    "https://raw.githubusercontent.com/brannygpbikes-web/brannygpbikes.github.io/refs/heads/main/elo_db.json";


let players = [];


/*
    DEFAULT:

    Elo
    Highest -> Lowest
*/

let currentSort =
    "elo";

let currentDirection =
    "desc";



/* ==========================================
   LOAD PLAYERS
   ========================================== */

async function loadPlayers() {


    const container =
        document.getElementById("players");


    try {


        const response =
            await fetch(

                ELO_URL +
                "?v=" +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Database returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();



        /*
            Use ALL FOUR statistics
            from elo_db.json.
        */

        players =
            Object.entries(data).map(

                ([name, stats]) => ({

                    name: name,

                    elo:
                        Number(stats.elo) || 0,

                    wins:
                        Number(stats.wins) || 0,

                    races:
                        Number(stats.races) || 0,

                    podiums:
                        Number(stats.podiums) || 0

                })

            );



        sortPlayers();


    }


    catch (error) {


        console.error(
            "Leaderboard error:",
            error
        );


        container.innerHTML = `

            <div class="status-message error-message">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <strong>
                    Rankings could not be loaded.
                </strong>

                <small>
                    The ranking database could not be reached.
                </small>

            </div>

        `;


    }


}



/* ==========================================
   SORT
   ========================================== */

function sortPlayers() {


    players.sort(

        (a, b) => {


            /*
                PLAYER NAME
            */

            if (currentSort === "name") {


                const comparison =
                    a.name.localeCompare(

                        b.name,

                        undefined,

                        {
                            sensitivity: "base"
                        }

                    );


                return currentDirection === "asc"

                    ? comparison

                    : -comparison;


            }



            /*
                STAT SORTING
            */

            const aValue =
                Number(a[currentSort]) || 0;


            const bValue =
                Number(b[currentSort]) || 0;



            /*
                TIE BREAKER

                If equal, highest Elo wins.
            */

            if (aValue === bValue) {


                if (currentSort !== "elo") {


                    if (b.elo !== a.elo) {

                        return b.elo - a.elo;

                    }


                }


                return a.name.localeCompare(
                    b.name
                );


            }



            /*
                HIGH -> LOW
                or
                LOW -> HIGH
            */

            return currentDirection === "desc"

                ? bValue - aValue

                : aValue - bValue;


        }

    );



    renderPlayers();

    updateSortButtons();


}



/* ==========================================
   DISPLAY LEADERBOARD
   ========================================== */

function renderPlayers() {


    const container =
        document.getElementById("players");


    container.innerHTML = "";



    if (players.length === 0) {


        container.innerHTML = `

            <div class="status-message">

                No ranked players yet.

            </div>

        `;


        return;


    }



    players.forEach(

        (player, index) => {


            const row =
                document.createElement("div");


            row.className =
                "player";



            /*
                TOP 3 RANK COLOURS
            */

            let rankClass = "";


            if (index === 0) {

                rankClass =
                    "rank-gold";

            }


            else if (index === 1) {

                rankClass =
                    "rank-silver";

            }


            else if (index === 2) {

                rankClass =
                    "rank-bronze";

            }



            row.innerHTML = `


                <div class="rank ${rankClass}">

                    ${index + 1}

                </div>


                <div class="player-name">

                    ${escapeHTML(
                        player.name
                    )}

                </div>


                <div class="elo">

                    ${formatNumber(
                        player.elo
                    )}

                </div>


                <div class="wins">

                    ${formatNumber(
                        player.wins
                    )}

                </div>


                <div class="races">

                    ${formatNumber(
                        player.races
                    )}

                </div>


                <div class="podiums">

                    ${formatNumber(
                        player.podiums
                    )}

                </div>


            `;


            container.appendChild(
                row
            );


        }

    );


}
