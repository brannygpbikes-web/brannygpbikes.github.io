<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elo Leaderboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;

        background-image: url("background.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;

    color: white;
}
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            color: #9ca3af;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .leaderboard {
            background: #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .player {
            display: grid;
            grid-template-columns: 70px 1fr 150px 120px;
            align-items: center;
            padding: 18px 20px;
            border-bottom: 1px solid #374151;
        }

        .player:last-child {
            border-bottom: none;
        }

        .player:hover {
            background: #273449;
        }

        .rank {
            color: #9ca3af;
            font-weight: bold;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
        }

        .elo {
            color: #60a5fa;
            font-weight: bold;
        }

        .wins {
            color: #34d399;
            font-weight: bold;
        }

        .headers {
            background: #374151;
            color: #d1d5db;
            font-size: 14px;
        }

        .error {
            padding: 20px;
            text-align: center;
            color: #fca5a5;
        }

        @media (max-width: 600px) {
            .player {
                grid-template-columns: 40px 1fr 80px 70px;
                padding: 15px 10px;
            }

            .name {
                font-size: 15px;
            }

            .elo,
            .wins {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>GP Bikes Academy Ranked</h1>
</header>

<div class="container">

    <div class="leaderboard">

        <div class="player headers">
            <div>#</div>
            <div>Player</div>
            <div>Elo</div>
            <div>Wins</div>
        </div>

        <div id="players">
            Loading...
        </div>

    </div>

</div>

<script>

async function loadPlayers() {

    const container = document.getElementById("players");

    try {

        // Load your JSON database
        const response = await fetch("elo_db.json");

        if (!response.ok) {
            throw new Error("Could not load elo_db.json");
        }

        const data = await response.json();

        // Convert:
        // {
        //   "PlayerName": {
        //      "elo": 1000,
        //      "wins": 5
        //   }
        // }
        //
        // into an array
        const players = Object.entries(data).map(([name, stats]) => ({
            name: name,
            elo: stats.elo ?? 0,
            wins: stats.wins
        }));

        // Sort by Elo, highest first
        players.sort((a, b) => b.elo - a.elo);

        container.innerHTML = "";

        players.forEach((player, index) => {

            const row = document.createElement("div");

            row.className = "player";

            // Show "—" if the JSON doesn't contain wins
            const wins = player.wins !== undefined
                ? player.wins
                : "—";

            row.innerHTML = `
                <div class="rank">${index + 1}</div>
                <div class="name">${escapeHTML(player.name)}</div>
                <div class="elo">${player.elo}</div>
                <div class="wins">${wins}</div>
            `;

            container.appendChild(row);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Could not load <strong>elo_db.json</strong>.
                Make sure it is in the same folder as index.html.
            </div>
        `;
    }
}


// Prevent player names containing HTML from affecting the page
function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


loadPlayers();

</script>

</body>
</html>
