
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GP Bikes Academy | Ranked</title>

    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;

            background-image:
                linear-gradient(
                    rgba(5, 8, 15, 0.72),
                    rgba(5, 8, 15, 0.82)
                ),
                url("background.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           NAVIGATION
        ========================================================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;

            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            background: rgba(8, 12, 20, 0.88);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #e10600;

            font-size: 19px;
        }

        .nav-links {
            display: flex;
            gap: 28px;

            color: #aeb5c2;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a {
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: white;
        }

           HERO
        ========================================================= */

            margin: 0 auto;

            padding: 85px 25px 55px;

            text-align: center;
