<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ranked - GP Bikes Academy
    </title>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">
            GP Bikes Academy Ranked
        </div>

    </header>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <nav class="sidebar">

        <a
            href="ranked.html"
            class="active"
        >

            <i class="fas fa-trophy"></i>

            <span class="label">
                Ranked
            </span>

        </a>


        <a
            href="https://discord.gg/NGwKCQ96m8"
            target="_blank"
            rel="noopener noreferrer"
            class="discord-link"
        >

            <i class="fab fa-discord"></i>

            <span class="label">
                Join the Discord
            </span>

        </a>

    </nav>


    <!-- =====================================================
         PAGE
    ====================================================== -->

    <main class="page">


        <div class="content">


            <!-- Season -->

            <div class="season-bar">
                2026 Ranked
            </div>


            <!-- Leaderboard -->

            <div class="container">

                <div class="leaderboard">


                    <!-- Table headings -->

                    <div class="player headers">

                        <div>
                            N°
                        </div>

                        <div>
                            Player
                        </div>

                        <div>
                            Elo
                        </div>

                        <div>
                            Wins
                        </div>

                    </div>


                    <!-- Players loaded from JSON -->

                    <div id="players">

                        <div class="error">
                            Loading rankings...
                        </div>

                    </div>


                </div>

            </div>


        </div>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        async function loadPlayers() {

            const container =
                document.getElementById("players");


            try {

                /*
                 * Load the player database.
                 *
                 * elo_db.json should be in the
                 * same folder as this file.
                 */

                const response =
                    await fetch("elo_db.json");


                if (!response.ok) {

                    throw new Error(
                        "Could not load elo_db.json"
                    );

                }


                const data =
                    await response.json();


                /*
                 * Convert the JSON object into
                 * an array of players.
                 */

                const players =
                    Object.entries(data).map(
                        ([name, stats]) => ({

                            name: name,

                            elo: stats.elo ?? 0,

                            wins: stats.wins

                        })
                    );


                /*
                 * Sort highest Elo first.
                 */

                players.sort(
                    (a, b) => b.elo - a.elo
                );


                /*
                 * Clear loading message.
                 */

                container.innerHTML = "";


                /*
                 * Create each player row.
                 */

                players.forEach(
                    (player, index) => {


                        const row =
                            document.createElement("div");


                        row.className =
                            "player";


                        /*
                         * If the player has no wins
                         * value in the JSON, display —.
                         */

                        const wins =
                            player.wins !== undefined
                                ? player.wins
                                : "—";


                        row.innerHTML = `

                            <div class="rank">
                                ${index + 1}
                            </div>

                            <div class="name">
                                ${escapeHTML(player.name)}
                            </div>

                            <div class="elo">
                                ${player.elo}
                            </div>

                            <div class="wins">
                                ${wins}
                            </div>

                        `;


                        container.appendChild(row);

                    }
                );


                /*
                 * Handle an empty database.
                 */

                if (players.length === 0) {

                    container.innerHTML = `

                        <div class="error">
                            No players found.
                        </div>

                    `;

                }

            }


            catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        Could not load
                        <strong>elo_db.json</strong>.

                        <br>

                        Make sure the JSON file is in
                        the same folder as ranked.html.

                    </div>

                `;

            }

        }


        /*
         * Prevent player names from being
         * interpreted as HTML.
         */

        function escapeHTML(text) {

            const div =
                document.createElement("div");


            div.textContent = text;


            return div.innerHTML;

        }


        /*
         * Load rankings when the page starts.
         */

        loadPlayers();

    </script>


</body>

</html>
