<main class="page">

    <div class="page-content">


        <div class="page-title">

            <div>

                <h1>
                    Announcements
                </h1>

                <p>
                    News and updates from GP Bikes Academy
                </p>

            </div>

        </div>


        <section class="panel">


            <div class="panel-title">

                <div>

                    <i class="fa-solid fa-bullhorn"></i>

                    Latest Announcements

                </div>

            </div>


            <div id="announcements"
                 class="announcements-list">

                <div class="status-message">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading announcements...

                </div>

            </div>


        </section>


    </div>

</main>


<script>

const ANNOUNCEMENTS_URL =
    "https://raw.githubusercontent.com/brannygpbikes-web/brannygpbikes.github.io/refs/heads/main/announcements.json";


async function loadAnnouncements() {

    const container =
        document.getElementById(
            "announcements"
        );


    try {

        const response = await fetch(

            ANNOUNCEMENTS_URL +
            "?v=" +
            Date.now(),

            {
                cache: "no-store"
            }

        );


        if (!response.ok) {

            throw new Error(
                "Announcements returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        container.innerHTML = "";


        if (
            !data.announcements ||
            data.announcements.length === 0
        ) {

            container.innerHTML = `

                <div class="status-message">

                    No announcements yet.

                </div>

            `;

            return;

        }


        data.announcements.forEach(
            announcement => {


                const article =
                    document.createElement(
                        "article"
                    );


                article.className =
                    "announcement";


                const type =
                    announcement.type

                        ? `

                            <div class="announcement-type">

                                ${escapeHTML(
                                    announcement.type
                                )}

                            </div>

                          `

                        : "";


                article.innerHTML = `

                    <div class="announcement-top">

                        <h2 class="announcement-title">

                            ${escapeHTML(
                                announcement.title
                            )}

                        </h2>


                        <div class="announcement-date">

                            ${escapeHTML(
                                announcement.date || ""
                            )}

                        </div>

                    </div>


                    ${type}


                    <p class="announcement-message">

                        ${escapeHTML(
                            announcement.message || ""
                        )}

                    </p>

                `;


                container.appendChild(
                    article
                );

            }
        );

    }


    catch (error) {

        console.error(
            "Announcements error:",
            error
        );


        container.innerHTML = `

            <div class="status-message error-message">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <strong>
                    Announcements could not be loaded.
                </strong>

                <small>
                    The announcements database could not be reached.
                </small>

            </div>

        `;

    }

}


function escapeHTML(value) {

    const element =
        document.createElement("div");

    element.textContent =
        String(value ?? "");

    return element.innerHTML;

}


loadAnnouncements();

</script>


</body>

</html>
