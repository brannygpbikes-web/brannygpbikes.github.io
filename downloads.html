```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Downloads - GP Bikes Academy Ranked</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="topbar">

    <div class="brand">
        GP Bikes Academy Ranked
    </div>

</header>


<nav class="sidebar">

    <a href="index.html">

        <i class="fas fa-trophy"></i>

        <span class="label">
            Ranked
        </span>

    </a>


    <a href="downloads.html"
       class="active">

        <i class="fas fa-download"></i>

        <span class="label">
            Downloads
        </span>

    </a>


    <a href="https://discord.gg/NGwKCQ96m8"
       target="_blank"
       rel="noopener noreferrer"
       class="discord-link">

        <i class="fab fa-discord"></i>

        <span class="label">
            Join the Discord
        </span>

    </a>

</nav>


<main class="page">

    <div class="content">

        <div class="season-bar">
            Downloads
        </div>


        <div id="downloads"
             class="downloads">

            <div class="message">
                Loading downloads...
            </div>

        </div>

    </div>

</main>


<script>

const DOWNLOADS_URL =
    "https://raw.githubusercontent.com/brannygpbikes-web/brannygpbikes.github.io/refs/heads/main/downloads.json";


async function loadDownloads() {

    const container =
        document.getElementById("downloads");


    try {

        /*
            Load downloads directly from GitHub.

            Timestamp prevents old cached versions
            from being displayed.
        */

        const response = await fetch(
            DOWNLOADS_URL + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "Could not load downloads."
            );

        }


        const data =
            await response.json();


        container.innerHTML = "";


        if (
            !data.categories ||
            data.categories.length === 0
        ) {

            container.innerHTML = `

                <div class="message">
                    No downloads yet.
                </div>

            `;

            return;

        }


        data.categories.forEach(
            category => {


                /*
                    CATEGORY TITLE
                */

                const categoryTitle =
                    document.createElement("div");


                categoryTitle.className =
                    "download-category";


                categoryTitle.innerHTML = `

                    <i class="${escapeHTML(category.icon || "fas fa-download")}"></i>

                    <span>
                        ${escapeHTML(category.name)}
                    </span>

                `;


                container.appendChild(
                    categoryTitle
                );



                /*
                    DOWNLOAD LIST
                */

                const list =
                    document.createElement("div");


                list.className =
                    "downloads-list";



                /*
                    NO DOWNLOADS IN CATEGORY
                */

                if (
                    !category.downloads ||
                    category.downloads.length === 0
                ) {

                    list.innerHTML = `

                        <div class="message">
                            Nothing here yet.
                        </div>

                    `;


                    container.appendChild(list);

                    return;

                }



                /*
                    CREATE DOWNLOAD CARDS
                */

                category.downloads.forEach(
                    item => {


                        const download =
                            document.createElement("div");


                        download.className =
                            "download-item";


                        download.innerHTML = `

                            <div class="download-icon">

                                <i class="${escapeHTML(category.icon || "fas fa-download")}"></i>

                            </div>


                            <div class="download-info">

                                <div class="download-name">

                                    ${escapeHTML(item.name)}

                                </div>


                                <div class="download-description">

                                    ${escapeHTML(item.description || "")}

                                </div>

                            </div>


                            <a
                                class="download-button"
                                href="${escapeAttribute(item.link)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >

                                <i class="fas fa-download"></i>

                                <span>
                                    Download
                                </span>

                            </a>

                        `;


                        list.appendChild(
                            download
                        );

                    }
                );


                container.appendChild(
                    list
                );

            }
        );

    }


    catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                <i class="fas fa-triangle-exclamation"></i>

                <br><br>

                Downloads could not be loaded.

            </div>

        `;

    }

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}


function escapeAttribute(text) {

    return String(text || "")

        .replaceAll("&", "&amp;")

        .replaceAll('"', "&quot;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;");

}


loadDownloads();

</script>


</body>

</html>
```
